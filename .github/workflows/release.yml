# Push a tag such as v0.6.0 to publish ready-to-run downloads for Linux, Windows and macOS
# on the repository's Releases page, plus a Docker image on ghcr.io.
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu,  name: linux-x86_64,   ext: '' }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, name: linux-arm64,    ext: '' }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    name: windows-x86_64, ext: '.exe' }
          - { os: macos-latest,     target: aarch64-apple-darwin,      name: macos-arm64,    ext: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          DIR=hoepedia-api-${{ github.ref_name }}-${{ matrix.name }}
          mkdir "$DIR"
          cp target/${{ matrix.target }}/release/hoepedia-api${{ matrix.ext }} "$DIR/"
          cp README.md ADVANCED.md .env.example start.sh start.ps1 start.bat "$DIR/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$DIR.zip" "$DIR" > /dev/null
          else
            tar czf "$DIR.tar.gz" "$DIR"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            hoepedia-api-*.zip
            hoepedia-api-*.tar.gz

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
